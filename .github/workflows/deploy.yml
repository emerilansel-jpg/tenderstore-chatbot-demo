name: Deploy to Production (Manual)

on:
  workflow_dispatch:

# NOTE: GitHub Actions IPs are blocked by server firewall (CSF).
# This workflow is kept for reference only.
# Deploy manually: ssh -p 8323 root@202.10.37.147
# Then run: bash <(curl -fsSL https://raw.githubusercontent.com/emerilansel-jpg/tenderstore-chatbot-demo/main/deploy.sh)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        run: |
          echo "Manual deploy workflow triggered."
          echo "Server firewall blocks GitHub Actions IPs on port 8323."
          echo "Use manual SSH deploy from your own machine instead."
          echo "SSH: ssh -p 8323 root@202.10.37.147"
          echo "Then: bash <(curl -fsSL https://raw.githubusercontent.com/emerilansel-jpg/tenderstore-chatbot-demo/main/deploy.sh)"
