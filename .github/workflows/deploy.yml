name: Deploy to Production
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via cPanel WHM API
        env:
          WHM_HOST: ${{ secrets.SSH_HOST }}
          WHM_PASS: ${{ secrets.SSH_PASS }}
        run: |
          set -e
          echo "=============================="
          echo "  TenderStore WHM Deploy"
          echo "=============================="

          # 1. Test WHM API connectivity
          echo "[1/4] Testing WHM API on port 2087..."
          WHM_VER=$(curl -sk --max-time 15 \
            -H "Authorization: WHM root:${WHM_PASS}" \
            "https://${WHM_HOST}:2087/json-api/version" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version','?'))" 2>/dev/null || echo "UNREACHABLE")
          echo "WHM version: ${WHM_VER}"

          if [ "$WHM_VER" = "UNREACHABLE" ]; then
            echo "ERROR: WHM API unreachable. SSH firewall also blocks GitHub IPs."
            echo "MANUAL STEP REQUIRED: SSH in once and run bash deploy.sh"
            exit 1
          fi

          # 2. Write PHP deploy script via WHM Fileman API
          echo "[2/4] Writing deploy script..."

          DEPLOY_PHP='<?php
          error_reporting(0);
          $dir = "/home/aigrowlab/tenderstore";
          $repo = "https://github.com/emerilansel-jpg/tenderstore-chatbot-demo.git";
          $log = [];
          if (!is_dir("$dir/.git")) {
            $log[] = shell_exec("git clone $repo $dir 2>&1");
          } else {
            $log[] = shell_exec("cd $dir && git pull origin main 2>&1");
          }
          $log[] = shell_exec("cd $dir && /usr/bin/npm install --production 2>&1");
          if (!file_exists("$dir/.env")) {
            file_put_contents("$dir/.env", "PORT=3000
GITHUB_REPO=emerilansel-jpg/tenderstore-chatbot-demo
GITHUB_TOKEN=REPLACE_ME
GEMINI_API_KEY=REPLACE_ME
OPENROUTER_API_KEY=REPLACE_ME
");
            $log[] = "Created .env placeholder - fill in real values via SSH";
          }
          $log[] = shell_exec("pm2 delete tenderstore 2>/dev/null; pm2 start $dir/app.js --name tenderstore && pm2 save 2>&1");
          if (!is_dir("/home/aigrowlab/public_html")) mkdir("/home/aigrowlab/public_html", 0755, true);
          file_put_contents("/home/aigrowlab/public_html/.htaccess",
            "Options -Indexes
RewriteEngine On
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^(.*)$ http://127.0.0.1:3000/$1 [P,L]
");
          $log[] = "Wrote .htaccess proxy";
          echo implode("
", array_filter($log)) . "
=== DEPLOY DONE ===
";
          ?>'

          curl -sk --max-time 30 \
            -H "Authorization: WHM root:${WHM_PASS}" \
            -X POST "https://${WHM_HOST}:2087/json-api/cpanel" \
            --data-urlencode "cpanel_jsonapi_user=aigrowlab" \
            --data "cpanel_jsonapi_apiversion=2" \
            --data "cpanel_jsonapi_module=Fileman" \
            --data "cpanel_jsonapi_func=save_file_content" \
            --data-urlencode "dir=/home/aigrowlab/public_html" \
            --data-urlencode "filename=_ts_deploy.php" \
            --data-urlencode "content=$DEPLOY_PHP"
          echo "Deploy script written."

          # 3. Execute the deploy script via HTTP
          echo "[3/4] Executing deploy..."
          curl -s --max-time 180 "http://${WHM_HOST}/_ts_deploy.php" || echo "Note: HTTP may redirect, check manually"

          # 4. Cleanup
          echo "[4/4] Cleaning up deploy script..."
          curl -sk --max-time 10 \
            -H "Authorization: WHM root:${WHM_PASS}" \
            -X POST "https://${WHM_HOST}:2087/json-api/cpanel" \
            --data-urlencode "cpanel_jsonapi_user=aigrowlab" \
            --data "cpanel_jsonapi_apiversion=2" \
            --data "cpanel_jsonapi_module=Fileman" \
            --data "cpanel_jsonapi_func=delete_files" \
            --data-urlencode "files-0=/public_html/_ts_deploy.php" > /dev/null 2>&1 || true

          echo "=============================="
          echo "  Deploy finished!"
          echo "  Check: http://${WHM_HOST}"
          echo "=============================="
